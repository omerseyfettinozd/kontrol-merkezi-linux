# Measured safe floor for the Slayer R9T fans (docs/07: no stall down to 20 % in the
# 2026-10-19 low-duty sweep; plan minimum 25 %). The module still ramps the floor to
# 50 % with temperature (CPU 60->75 C, GPU 55->70 C). Remove this file for the 0.2.0
# floor of 50 %.
options r9t_fan min_duty=25
