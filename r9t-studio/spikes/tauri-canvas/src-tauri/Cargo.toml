[package]
name = "r9t-tauri-canvas-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Kendi workspace kökü: ileride r9t-studio/Cargo.toml workspace'ine karışmaz.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
