[package]
name = "r9t-studio"
version = "0.1.0"
edition = "2021"
publish = false
description = "R9T Studio arayüzü: r9td ve r9t-session soket istemcisi"

# Kendi workspace kökü: Tauri bağımlılıkları servis crate'lerinin kilit dosyasına karışmaz.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
