name: Rust regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Rust workspace and r9t_fan C faults
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: r9t-studio
    env:
      CARGO_TERM_COLOR: always
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Rust toolchain (stable, edition 2024)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version && cc --version | head -n1

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      # Includes crates/r9t-hal/tests/r9t_fan_c_faults.rs: the real driver/r9t_fan/r9t_fan.c
      # compiled against an in-memory EC; no hardware is touched (fake sysfs everywhere).
      - name: Tests
        run: cargo test --workspace --locked
