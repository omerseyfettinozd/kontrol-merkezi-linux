name: Headless regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python / Qt offscreen and fan C faults
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      R9T_LIVE_CHECK: "0"
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.7"

      - name: Install headless test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install --only-binary=:all: PySide6==6.11.2

      - name: Run Python and Qt regressions
        working-directory: outputs
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Exercise real fan C source with simulated EC faults
        run: python outputs/fan-driver/test_fallback.py
